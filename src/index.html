<!-- src/index.html -->

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>unimo</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />

    <link rel="stylesheet" href="static/styles.css" />
  </head>
  <body>
    <div id="app" data-ready="false" data-startup-ms="">
      <div class="search-box">
        <form>
          <input
            id="search-input"
            type="text"
            placeholder="Search, talk or note ..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            autofocus
          />
        </form>
        <div class="selection-highlight" id="selection"></div>
        <div class="caret" id="caret"></div>
      </div>
      <span class="text-measurer" id="measurer"></span>
      <div class="action-buttons" hidden>
        <button type="button" data-action="note">Add note</button>
        <button type="button" data-action="web">Search web</button>
        <button type="button" data-action="chat">AI chat</button>
      </div>
      <div class="results">
        <!-- Example items -->
        <!-- <div class="result-item active">
          <div class="result-icon">📁</div>
          <div class="result-content">
            <div class="result-title">Open Project</div>
            <div class="result-subtitle">~/code/lattice-sdk</div>
          </div>
          <span class="result-shortcut">⏎</span>
        </div>
        <div class="result-item">
          <div class="result-icon">⚙️</div>
          <div class="result-content">
            <div class="result-title">Settings</div>
            <div class="result-subtitle">App preferences</div>
          </div>
        </div> -->
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
