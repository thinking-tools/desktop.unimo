<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unimo.desktop</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <link rel="stylesheet" href="./ui/static/styles.css" />
  </head>
  <body>
    <template id="tpl-item">
      <div role="option">
        <i aria-hidden="true"></i>
        <span><b></b><small></small></span>
        <nav aria-label="Actions">
          <button data-action="primary" aria-label="Open" title="Enter">↵</button>
          <button data-action="more" aria-label="More actions">⋯</button>
        </nav>
      </div>
    </template>

    <template id="tpl-action">
      <div role="option" data-kind="action">
        <i aria-hidden="true"></i>
        <span><b></b></span>
        <nav aria-label="Actions">
          <button data-action="primary" aria-label="Run" title="Enter">↵</button>
        </nav>
      </div>
    </template>

    <main id="app" data-ready="false" data-startup-ms="">
      <search>
        <button id="tag" popovertarget="account-menu" aria-label="Account"></button>
        <div id="input-wrap">
          <input type="search" id="input" placeholder="Type to search…" spellcheck="false" autocomplete="off" />
        </div>
      </search>
      <menu id="account-menu" popover>
        <button role="menuitem">Settings</button>
        <hr />
        <button role="menuitem">Log out</button>
      </menu>
      <div role="listbox" id="results"></div>
    </main>

    <script type="module" src="./ui/renderer.js"></script>
  </body>
</html>
