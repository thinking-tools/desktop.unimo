<!-- src/index.html -->
<!doctype html>
<html>
  <body>
    <div id="app" data-ready="false" data-startup-ms="">Loading...</div>
    <script>
      (async () => {
        const mainStartTime = await window.electronPerf.getStartTime();
        const now = Date.now();
        const el = document.getElementById("app");
        el.dataset.startupMs = now - mainStartTime;
        el.dataset.ready = "true";
        el.textContent = "Ready";
      })();
    </script>
  </body>
</html>
